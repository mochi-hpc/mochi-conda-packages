{% set name = "tclap" %}
{% set version = "1.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://prdownloads.sourceforge.net/tclap/{{ name }}-{{ version }}.tar.gz
  sha256: bb649f76dae35e8d0dcba4b52acfd4e062d787e6a81b43f7a4b01275153165a6

build:
  number: 0
  noarch: generic

requirements:
  build:
    - make

test:
  commands:
    - test -f $PREFIX/include/tclap/CmdLine.h

about:
  home: https://tclap.sourceforge.net
  license: MIT
  license_family: MIT
  summary: Templatized C++ Command Line Parser
  description: |
    TCLAP is a small, flexible library that provides a simple interface
    for defining and accessing command line arguments in C++ programs.
    This is a header-only library.

extra:
  recipe-maintainers:
    - mdorier
