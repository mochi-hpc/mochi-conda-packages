{% set name = "mofka" %}
{% set version = "0.8.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mochi-hpc/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 627c216f5f308302a9f62c1a7d723a857bac207ac4a7b9a11ec9d1db80536871

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.21
    - make
    - pkg-config
  host:
    - mochi-margo >=0.19.1
    - mochi-thallium >=0.15.1
    - mochi-bedrock >=0.15.0
    - mochi-flock >=0.5.0
    - mochi-warabi >=0.5.0
    - mochi-yokan >=0.6.0
    - diaspora-stream-api >=0.5.0
    - nlohmann_json
    - nlohmann-json-schema-validator
    - spdlog
    - fmt
    - libuuid
    # Python support
    - py-mochi-margo
    - pybind11
    - python
  run:
    - mochi-margo >=0.19.1
    - mochi-thallium >=0.15.1
    - mochi-bedrock >=0.15.0
    - mochi-flock >=0.5.0
    - mochi-warabi >=0.5.0
    - mochi-yokan >=0.6.0
    - diaspora-stream-api >=0.5.0
    - nlohmann_json
    - nlohmann-json-schema-validator
    - spdlog
    - fmt
    - libuuid
    # Python support
    - py-mochi-margo
    - python
    - rich
    - typer

test:
  commands:
    - test -f $PREFIX/lib/libmofka.so  # [linux]
    - test -f $PREFIX/lib/libmofka.dylib  # [osx]
    - test -f $PREFIX/include/mofka/MofkaDriver.hpp
  imports:
    - mochi.mofka

about:
  home: https://github.com/mochi-hpc/mofka
  license: MIT
  license_family: MIT
  summary: Mofka - Mochi-based distributed event-streaming service for HPC
  description: |
    Mofka is a Mochi-based distributed event-streaming service for HPC.

extra:
  recipe-maintainers:
    - mdorier
