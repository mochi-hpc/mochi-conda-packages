{% set name = "unqlite-c" %}
{% set version = "1.1.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/symisc/unqlite/archive/v{{ version }}.tar.gz
  sha256: 33d5b5e7b2ca223942e77d31112d2e20512bc507808414451c8a98a7be5e15c0

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make

test:
  commands:
    - test -f $PREFIX/lib/libunqlite.a
    - test -f $PREFIX/include/unqlite.h

about:
  home: https://unqlite.org/
  license: BSD-2-Clause
  license_family: BSD
  summary: UnQLite - serverless NoSQL database engine
  description: |
    UnQLite is an in-process software library which implements a self-contained,
    serverless, zero-configuration, transactional NoSQL database engine.

extra:
  recipe-maintainers:
    - mdorier
