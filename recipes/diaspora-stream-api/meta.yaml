{% set name = "diaspora-stream-api" %}
{% set version = "0.5.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/diaspora-project/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 88d16bdd211ea80fe4257abb048945d2b3ed669fc3484a49b15a99ad3632cc81

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.21
    - make
    - pkg-config
  host:
    - nlohmann_json
    - nlohmann-json-schema-validator
    - spdlog
    - yaml-cpp
    - tclap
    # Python support
    - pybind11
    - python
  run:
    - nlohmann_json
    - nlohmann-json-schema-validator
    - spdlog
    - yaml-cpp
    - python

test:
  commands:
    - test -f $PREFIX/include/diaspora/DataDescriptor.hpp
  imports:
    - diaspora_stream.api

about:
  home: https://github.com/diaspora-project/diaspora-stream-api
  license: MIT
  license_family: MIT
  summary: An API for distributed event-streaming service for HPC
  description: |
    An API for distributed event-streaming service for HPC.

extra:
  recipe-maintainers:
    - mdorier
