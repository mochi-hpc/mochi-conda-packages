{% set name = "mochi-thallium" %}
{% set version = "0.17.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mochi-hpc/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ed65ef967e9e6c2ac58852e6d59a7339b9b8d25bbb32b4e775cd84ddea466564

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
    - pkg-config
  host:
    - mochi-margo >=0.6
    - cereal >=1.3.1
  run:
    - mochi-margo >=0.6
    - cereal >=1.3.1

test:
  commands:
    - test -f $PREFIX/include/thallium.hpp

about:
  home: https://github.com/mochi-hpc/mochi-thallium
  license: MIT
  license_family: MIT
  summary: Thallium - C++14 library wrapping Margo, Mercury, and Argobots
  description: |
    A Mochi C++14 library wrapping Margo, Mercury, and Argobots and
    providing an object-oriented way to use these libraries.

extra:
  recipe-maintainers:
    - mdorier
