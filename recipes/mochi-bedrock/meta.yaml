{% set name = "mochi-bedrock" %}
{% set version = "0.16.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mochi-hpc/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f2285ef773fbb8ca4bfbb8799e8e400873d65723a8b097089ad0d95aa90648d9

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.8
    - make
    - pkg-config
  host:
    - mochi-margo >=0.15.0
    - mochi-thallium >=0.14.3
    - mochi-bedrock-module-api >=0.2.0
    - nlohmann_json
    - nlohmann-json-schema-validator >=2.3.0
    - spdlog
    - fmt
    - tclap
    - toml11 >=4.0.0
    - mochi-flock >=0.3.0  # [flock]
    - {{ mpi }}            # [use_mpi]
    - py-mochi-margo
    - pybind11
    - python
    - attrs >=22.2.0
    - rich
    - typer
  run:
    # mpi is intentionally omitted here - install it explicitly
    # or load a system-provided module to have the libraries/executables in LD_LIBRARY_PATH
    - mochi-margo >=0.15.0
    - mochi-thallium >=0.14.3
    - mochi-bedrock-module-api >=0.2.0
    - nlohmann_json
    - spdlog
    - fmt
    - toml11 >=4.0.0
    - mochi-flock >=0.3.0  # [flock]
    - py-mochi-margo
    - python
    - attrs >=22.2.0
    - rich
    - typer

test:
  commands:
    - test -f $PREFIX/lib/libbedrock-server.so   # [linux]
    - test -f $PREFIX/lib/libbedrock-server.dylib  # [osx]
    - test -f $PREFIX/include/bedrock/Server.hpp
    - bedrock-query --help
  imports:
    - mochi.bedrock

about:
  home: https://github.com/mochi-hpc/mochi-bedrock
  license: MIT
  license_family: MIT
  summary: Mochi Bedrock - bootstrapping system for Mochi microservices
  description: |
    Bedrock is a bootstrapping system for Mochi microservices, providing
    a framework for deploying and managing distributed HPC services.

extra:
  recipe-maintainers:
    - mdorier
